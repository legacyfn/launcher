name: Build launcher

on:
  push:
    tags:
      - "v*"           # optioneel: tag pushen publiceert ook
  workflow_dispatch:    # knop "Run workflow" op GitHub (web)
    inputs:
      publish:
        description: "Publiceren naar GitHub Releases (versie uit package.json)"
        type: boolean
        default: true

permissions:
  contents: write       # nodig om een release aan te maken / bestanden te uploaden

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check dat tag en package.json-versie overeenkomen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -ne $ver) { throw "Tag ($tag) komt niet overeen met package.json ($ver)" }

      - name: Dependencies installeren
        run: npm install

      - name: Bouwen en publiceren
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bouwen (zonder publiceren)
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.publish) }}
        run: npm run dist

      - name: Build als artifact bewaren
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
