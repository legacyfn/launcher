name: Tauri Build and Release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify Tauri source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-windows
          workspaces: "src-tauri -> target"

      - name: Cache Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-v2-${{ runner.os }}

      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo install tauri-cli --version "^2" --locked

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          $configVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tagVersion -ne $cargoVersion -or $tagVersion -ne $configVersion) {
            throw "Tag ($tagVersion), Cargo.toml ($cargoVersion) and tauri.conf.json ($configVersion) must match."
          }

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check Rust build
        run: cargo check --manifest-path src-tauri/Cargo.toml

  signed-build-validation:
    name: Build signed Tauri installer (no release)
    needs: verify
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-windows
          workspaces: "src-tauri -> target"

      - name: Cache Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-v2-${{ runner.os }}

      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build signed Windows installer
        shell: pwsh
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Save signed installer and updater artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tauri-4.3.3-signed-windows-test
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  release:
    name: Build and publish Tauri installer
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-windows
          workspaces: "src-tauri -> target"

      - name: Cache Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-v2-${{ runner.os }}

      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build and publish signed Tauri updater
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tauriScript: cargo tauri
          tagName: v__VERSION__
          releaseName: Project Legacy Launcher v__VERSION__
          releaseBody: |
            Project Legacy Launcher release built with Tauri 2.
            The Windows installer and signed updater metadata are attached below.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis

  verify-published-release:
    name: Verify published updater feed
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Validate public release assets and latest.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "${{ github.ref_name }}"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$tag"
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          if ($assetNames -notcontains "latest.json") { throw "The published release does not contain latest.json." }
          if (-not ($assetNames | Where-Object { $_ -match '\.exe$' })) { throw "The release has no Windows installer." }
          if (-not ($assetNames | Where-Object { $_ -match '\.exe\.sig$' })) { throw "The release has no Windows installer signature." }
          $manifestAsset = $release.assets | Where-Object { $_.name -eq "latest.json" } | Select-Object -First 1
          $manifest = Invoke-RestMethod -Uri $manifestAsset.browser_download_url
          $expectedVersion = $tag -replace '^v', ''
          $manifestVersion = ([string]$manifest.version) -replace '^v', ''
          if ($manifestVersion -ne $expectedVersion) { throw "Updater manifest version does not match the release tag." }
          $windows = $manifest.platforms.'windows-x86_64'
          if (-not $windows -or [string]::IsNullOrWhiteSpace([string]$windows.url) -or [string]::IsNullOrWhiteSpace([string]$windows.signature)) { throw "latest.json is missing the Windows URL or signature." }
          $updateUri = [System.Uri]::new([string]$windows.url)
          if ($updateUri.Scheme -ne "https") { throw "The updater URL must use HTTPS." }
          Write-Host "Release $tag has an installer, signature, and valid Windows updater manifest."
